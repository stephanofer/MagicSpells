name: MagicSpells
main: com.nisovin.magicspells.MagicSpells
version: $magicspellsVersion
authors: [nisovin, TheComputerGeek2,Chronoken]
softdepend: [Vault,ProtocolLib,WorldGuard,PowerNBT,LibsDisguises,PlaceholderAPI]
depend: [EffectLib]
commands:
    magicspellcast:
        description: Cast a spell
        usage: /<command>
        aliases: [cast,c]
    magicspellmana:
        description: Show mana bar
        usage: /<command>
        aliases: [mana]
    magicspellxp:
        description: Show magic XP info
        usage: /<command>
        aliases: [magicxp,spellxp]
