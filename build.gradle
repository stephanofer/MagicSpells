import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.0'
}

group = 'com.github.TheComputerGeek2'
version = '3.6'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.extendedclip.com/releases/'
    }
}

configurations {
    shade {
        canBeConsumed = false
        canBeResolved = true
    }
    coreClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
    teamsClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
    memoryClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
    shopClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
    townyClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
    factionsClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    shade 'org.apache.commons:commons-math3:3.0'

    coreClasspath files(
        'lib/spigot-1.12.jar',
        'lib/spigot-1.11.2.jar',
        'lib/spigot-1.10.2.jar',
        'lib/spigot-1.9.4.jar',
        'lib/spigot-1.9.jar',
        'lib/spigot-1.8.7.jar',
        'lib/spigot-1.8-R0.1-SNAPSHOT.jar',
        'lib/EffectLib-4.0.jar',
        'lib/ProtocolLib.jar',
        'lib/WorldEdit.jar',
        'lib/WorldGuard.jar',
        'lib/LibsDisguises-9.0.9.jar',
        'lib/Vault.jar'
    )
    coreClasspath 'me.clip:placeholderapi:2.11.6'

    teamsClasspath files('lib/spigot-1.12.jar')
    memoryClasspath files('lib/spigot-1.12.jar')
    shopClasspath files('lib/spigot-1.12.jar', 'lib/Vault.jar')
    townyClasspath files('lib/spigot-1.12.jar', 'lib/Towny.jar')
    factionsClasspath files('lib/spigot-1.12.jar', 'lib/MassiveCore.jar', 'lib/Factions.jar')
}

def deploymentNaming = providers.gradleProperty('DeploymentNaming').isPresent()
def releaseBuild = providers.gradleProperty('release').isPresent()
def versionSuffix = releaseBuild ? 'Release' : "dev-${new Date().format('yyMMddHHmm')}"
def distDirectory = layout.projectDirectory.dir('dist')
def compiler = javaToolchains.compilerFor {
    languageVersion = JavaLanguageVersion.of(8)
}

class MagicSpellsData {
    String coreVersion = '3.6'
    String teamsVersion = '1.0'
    String memoryVersion = '1.2'
    String shopVersion = '1.6'
    String townyVersion = '1.3'
    String factionsVersion = '1.0'
    String stringVersionCore
    String stringVersionTeams
    String stringVersionMemory
    String stringVersionShop
    String stringVersionTowny
    String stringVersionFactions
}

def magicspellsData = new MagicSpellsData(
    stringVersionCore: "3.6-${versionSuffix}",
    stringVersionTeams: "1.0-${versionSuffix}",
    stringVersionMemory: "1.2-${versionSuffix}",
    stringVersionShop: "1.6-${versionSuffix}",
    stringVersionTowny: "1.3-${versionSuffix}",
    stringVersionFactions: "1.0-${versionSuffix}"
)
ext.magicspellsData = magicspellsData

def artifactName = { String name, String componentVersion ->
    deploymentNaming ? "${name}.jar" : "${name}-${componentVersion}-${versionSuffix}.jar"
}

def coreClasses = layout.buildDirectory.dir('classes/magicspells-core')
def coreCompile = tasks.register('magicspellsCoreCompile', JavaCompile) {
    description = 'Compile the main MagicSpells sources.'
    source = fileTree('src') { include '**/*.java' }
    classpath = configurations.coreClasspath + configurations.shade
    destinationDirectory = coreClasses
    javaCompiler = compiler
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}
def coreResources = tasks.register('magicspellsCoreCopyResources', Copy) {
    description = 'Copy MagicSpells resources.'
    inputs.property('magicspellsVersion', magicspellsData.stringVersionCore)
    from('src') { include '**/*.yml' }
    into(coreClasses)
    expand(magicspellsVersion: magicspellsData.stringVersionCore)
}
def coreJar = tasks.register('magicspellsCoreJar', ShadowJar) {
    description = 'Create the main MagicSpells jar.'
    inputs.property('magicspellsVersion', magicspellsData.stringVersionCore)
    dependsOn(coreCompile, coreResources)
    from(coreClasses)
    configurations = [project.configurations.shade]
    archiveFileName = artifactName('MagicSpells', magicspellsData.coreVersion)
    destinationDirectory = distDirectory
    relocate 'org.apache.commons.math3', 'com.nisovin.magicspells.shaded.org.apache.commons'
    exclude '**/*.xml', '**/*pom.properties', '**/*LocalizedFormats*'
}

def registerAddon = { String taskPrefix, String artifactBaseName, String sourceDirectory, String componentVersion, Configuration classpathConfiguration ->
    def classesDirectory = layout.buildDirectory.dir("classes/magicspells-${taskPrefix}")
    def compileTask = tasks.register("magicspells${taskPrefix.capitalize()}Compile", JavaCompile) {
        description = "Compile the ${taskPrefix} addon."
        dependsOn(coreJar)
        source = fileTree(sourceDirectory) { include '**/*.java' }
        classpath = classpathConfiguration + files(coreJar.flatMap { it.archiveFile })
        destinationDirectory = classesDirectory
        javaCompiler = compiler
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
    def resourcesTask = tasks.register("magicspells${taskPrefix.capitalize()}CopyResources", Copy) {
        description = "Copy ${taskPrefix} addon resources."
        inputs.property('magicspellsVersion', "${componentVersion}-${versionSuffix}")
        from(sourceDirectory) { include '**/*.yml' }
        into(classesDirectory)
        expand(magicspellsVersion: "${componentVersion}-${versionSuffix}")
    }
    tasks.register("magicspells${taskPrefix.capitalize()}Jar", Jar) {
        description = "Create the ${taskPrefix} addon jar."
        inputs.property('magicspellsVersion', "${componentVersion}-${versionSuffix}")
        dependsOn(compileTask, resourcesTask)
        from(classesDirectory)
        archiveFileName = artifactName(artifactBaseName, componentVersion)
        destinationDirectory = distDirectory
    }
}

def teamsJar = registerAddon('teams', 'MagicSpellsTeams', 'src_teams', magicspellsData.teamsVersion, configurations.teamsClasspath)
def memoryJar = registerAddon('memory', 'MagicSpellsMemory', 'src_memory', magicspellsData.memoryVersion, configurations.memoryClasspath)
def shopJar = registerAddon('shop', 'MagicSpellsShop', 'src_shop', magicspellsData.shopVersion, configurations.shopClasspath)
def townyJar = registerAddon('towny', 'MagicSpellsTowny', 'src_towny', magicspellsData.townyVersion, configurations.townyClasspath)
def factionsJar = registerAddon('factions', 'MagicSpellsFactions', 'src_factions', magicspellsData.factionsVersion, configurations.factionsClasspath)

def allJars = [coreJar, teamsJar, memoryJar, shopJar, townyJar, factionsJar]
def magicspellsZip = tasks.register('magicspellsZip', Zip) {
    description = 'Zip all MagicSpells jars.'
    dependsOn(allJars)
    from(allJars.collect { it.flatMap { task -> task.archiveFile } })
    archiveFileName = 'MagicSpells.zip'
    destinationDirectory = distDirectory
}

tasks.register('magicspellsJarAll') {
    description = 'Create all MagicSpells jars and the distribution zip.'
    dependsOn(magicspellsZip)
}

tasks.register('magicspellsBuild') {
    description = 'Build all MagicSpells artifacts.'
    dependsOn('magicspellsJarAll')
}

tasks.register('magicspellsRelease') {
    description = 'Build all MagicSpells artifacts with release names.'
    dependsOn('magicspellsJarAll')
    doFirst {
        if (!releaseBuild) {
            throw new GradleException('Use -Prelease with magicspellsRelease.')
        }
    }
}

tasks.named('clean') {
    delete(distDirectory)
}
